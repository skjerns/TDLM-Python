name: MATLAB tests

# Regenerates the MATLAB reference results with the original MATLAB code and
# checks that the python implementation gives the same results.
# The MATLAB engine for Python is not supported on GitHub-hosted runners, so
# MATLAB is run via `matlab -batch` and the results are compared from python.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run-matlab-tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@v4

    - name: Set up MATLAB
      uses: matlab-actions/setup-matlab@v3
      with:
        release: R2026a
        products: Statistics_and_Machine_Learning_Toolbox
        cache: true

    - name: Generate MATLAB reference results
      uses: matlab-actions/run-command@v3
      with:
        command: addpath('tdlm/tests/matlab_code'); generate_references

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements-test.txt
        pip install -e .

    - name: Run MATLAB compatibility tests with pytest
      run: pytest -s -vv tdlm/tests/test_matlab_compatibility.py
